[package]
name = "roadcuse"
version = "0.1.0"
edition = "2024"
description = "Native desktop load tester powered by Goose"

[dependencies]
anyhow = "1"
csv = "1"
eframe = "0.36"
goose = "0.18.1"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
